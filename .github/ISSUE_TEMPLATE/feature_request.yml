name: Feature request
description: Propose a change. Describe the problem before the solution.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
